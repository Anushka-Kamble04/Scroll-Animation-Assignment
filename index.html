<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopNest | Festival Sale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scroll" id="scroll">
      <section class="hero">
        <header class="topbar">
          <span class="brand">ShopNest</span>
          <a class="cta" href="#shop">Shop the sale</a>
        </header>

        <h1 class="headline" aria-label="Festival Sale">
          <span class="ch">F</span>
          <span class="ch">E</span>
          <span class="ch">S</span>
          <span class="ch">T</span>
          <span class="ch">I</span>
          <span class="ch">V</span>
          <span class="ch">A</span>
          <span class="ch">L</span>
          <span class="ch gap"></span>
          <span class="ch">S</span>
          <span class="ch">A</span>
          <span class="ch">L</span>
          <span class="ch">E</span>
        </h1>

        <div class="road" id="road">
          <div class="trail" id="trail"></div>
          <div class="van" id="van">
            <svg
              class="van-svg"
              viewBox="0 0 240 110"
              role="img"
              aria-label="ShopNest delivery van"
            >
              <rect x="22" y="2" width="30" height="12" rx="4" fill="#120620" />
              <rect
                x="22"
                y="96"
                width="30"
                height="12"
                rx="4"
                fill="#120620"
              />
              <rect
                x="164"
                y="2"
                width="30"
                height="12"
                rx="4"
                fill="#120620"
              />
              <rect
                x="164"
                y="96"
                width="30"
                height="12"
                rx="4"
                fill="#120620"
              />
              <rect
                x="6"
                y="10"
                width="170"
                height="90"
                rx="12"
                fill="#fff4e0"
              />
              <rect
                x="170"
                y="14"
                width="60"
                height="82"
                rx="22"
                fill="#ff3e7f"
              />
              <path
                d="M196 24 h20 q6 0 6 8 v46 q0 8 -6 8 h-20 z"
                fill="#2a0f45"
              />
              <rect
                x="18"
                y="22"
                width="140"
                height="66"
                rx="8"
                fill="#ffb627"
              />
              <text
                x="88"
                y="64"
                text-anchor="middle"
                font-family="Bricolage Grotesque, Arial, sans-serif"
                font-weight="800"
                font-size="26"
                fill="#1b0b2e"
              >
                SALE
              </text>
              <circle cx="228" cy="26" r="4" fill="#fff4e0" />
              <circle cx="228" cy="84" r="4" fill="#fff4e0" />
            </svg>
          </div>
        </div>

        <ul class="stats">
          <li class="stat s1">
            <strong>30%</strong><span>off on fashion and footwear</span>
          </li>
          <li class="stat s2">
            <strong>50%</strong><span>cashback on your first order</span>
          </li>
          <li class="stat s3">
            <strong>Limited</strong><span>offer, while stocks last</span>
          </li>
          <li class="stat s4">
            <strong>5 days</strong><span>left until the sale ends</span>
          </li>
        </ul>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
